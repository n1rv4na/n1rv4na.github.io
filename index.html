<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Īpaša Ziņa Tev ❤️</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --r50:#fff5f7; --r100:#ffe6ec; --r200:#fcccd8; --r300:#fa9bb2; --r400:#f76186;
      --r500:#ef2e5f; --r600:#db1448; --r700:#b80b36;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, var(--r100) 0%, var(--r50) 50%, var(--r200) 100%);
      min-height: 100vh; min-height: 100dvh;
      overflow-x: hidden; color: #374151;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 1rem; -webkit-tap-highlight-color: transparent;
    }
    ::selection { background: var(--r200); }

    /* Floating background hearts */
    #floaters { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .floater { position: absolute; bottom: -10vh; animation: floatUp linear infinite; opacity: 0; }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0); opacity: 0; }
      10%, 90% { opacity: .4; }
      100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
    }

    header { text-align: center; margin-top: 1.5rem; z-index: 1; }
    .pill {
      display: inline-block; padding: .4rem 1rem; border-radius: 999px; background: rgba(255,255,255,.7);
      backdrop-filter: blur(8px); color: var(--r600); font-size: .85rem; font-weight: 600;
      border: 1px solid var(--r200); box-shadow: 0 1px 3px rgba(0,0,0,.05); margin-bottom: .75rem;
    }
    h1 { font-family: 'Dancing Script', cursive; font-size: clamp(2.8rem, 9vw, 3.8rem); color: var(--r600); margin: 0 0 .4rem; }
    .sub { color: #4b5563; font-weight: 500; max-width: 28rem; margin: 0 auto; }

    main { z-index: 1; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 28rem; margin: auto 0; }

    /* The heart */
    .heart-wrap { position: relative; margin: 2.5rem 0 2rem; display: grid; place-items: center; }
    .heart-glow { position: absolute; width: 220px; height: 220px; border-radius: 50%; background: rgba(247,97,134,.35); filter: blur(40px); transition: background .5s; }
    #heart {
      position: relative; width: 200px; height: 190px; border: 0; background: none; padding: 0; cursor: pointer;
      animation: heartbeat 2.2s infinite ease-in-out; transition: transform .2s, filter .3s, opacity .3s;
      filter: drop-shadow(0 14px 22px rgba(219,20,72,.35));
    }
    #heart svg { width: 100%; height: 100%; display: block; overflow: visible; }
    #heart .label {
      position: absolute; left: 50%; top: 44%; transform: translate(-50%,-50%);
      color: #fff; font-weight: 700; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase;
      background: rgba(184,11,54,.3); border: 1px solid rgba(255,255,255,.25); padding: .3rem .8rem; border-radius: 999px; white-space: nowrap;
    }
    #heart:hover { animation-play-state: paused; transform: scale(1.08); }
    #heart:active { transform: scale(.92); }
    #heart:focus-visible { outline: 3px dashed var(--r400); outline-offset: 8px; border-radius: 20px; }
    #heart.squish { animation: squish .45s ease; }
    #heart.empty { animation: none; filter: grayscale(.35) drop-shadow(0 10px 16px rgba(219,20,72,.2)); opacity: .8; }
    #heart:disabled { cursor: default; }
    @keyframes heartbeat { 0%,28%,70%,100% { transform: scale(1); } 14% { transform: scale(1.1); } 42% { transform: scale(1.13); } }
    @keyframes squish { 0% { transform: scale(1); } 30% { transform: scale(.8, .75); } 60% { transform: scale(1.2, 1.15); } 100% { transform: scale(1); } }

    .card {
      width: 100%; background: rgba(255,255,255,.8); backdrop-filter: blur(8px); border-radius: 1rem;
      padding: 1rem; box-shadow: 0 10px 25px -5px rgba(239,46,95,.12); border: 1px solid var(--r100); text-align: center;
    }
    .card .row { display: flex; justify-content: space-between; align-items: center; }
    .card .k { font-size: .72rem; font-weight: 700; color: var(--r600); letter-spacing: .08em; text-transform: uppercase; }
    .card .v { font-size: .85rem; font-weight: 700; color: var(--r600); background: var(--r100); padding: .1rem .6rem; border-radius: 999px; }
    #hint { font-size: .85rem; color: #6b7280; margin: 0; font-weight: 500; }

    footer { z-index: 1; padding: 1rem; font-size: .75rem; color: #6b7280; text-align: center; }
    .edit-link { margin-left: .35rem; text-decoration: none; opacity: .35; transition: opacity .2s; }
    .edit-link:hover, .edit-link:focus-visible { opacity: 1; }

    /* Modal + envelope animation */
    #modal {
      position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 1rem;
      background: rgba(80,10,30,.35); backdrop-filter: blur(4px);
    }
    #modal.show { display: flex; animation: fade .3s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .stage { position: relative; width: min(92vw, 380px); display: flex; flex-direction: column; align-items: center; }

    .envelope { position: relative; width: 260px; height: 170px; margin-top: 150px; animation: dropIn .6s cubic-bezier(.175,.885,.32,1.275) both; }
    @keyframes dropIn { from { transform: translateY(-60px) scale(.6) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
    .env-back { position: absolute; inset: 0; background: var(--r400); border-radius: 10px; }
    .env-front {
      position: absolute; inset: 0; border-radius: 10px; z-index: 3;
      background:
        linear-gradient(to top right, var(--r300) 50%, transparent 50.5%) left / 50% 100% no-repeat,
        linear-gradient(to top left, var(--r300) 50%, transparent 50.5%) right / 50% 100% no-repeat;
    }
    .env-front::after { content: "❤"; position: absolute; left: 50%; top: 58%; transform: translate(-50%,-50%); color: var(--r600); font-size: 1.6rem; }
    .env-flap {
      position: absolute; left: 0; right: 0; top: 0; height: 100px; z-index: 4; transform-origin: top center;
      clip-path: polygon(0 0, 100% 0, 50% 100%); background: var(--r500);
      transition: transform .6s ease .5s, z-index 0s linear .8s;
    }
    .letter {
      position: absolute; left: 14px; right: 14px; bottom: 8px; height: 150px; z-index: 2;
      background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08);
      transition: transform .7s cubic-bezier(.2,.9,.3,1.2) 1.1s;
      display: grid; place-items: center; font-family: 'Dancing Script', cursive; color: var(--r500); font-size: 1.4rem;
    }
    .stage.open .env-flap { transform: rotateX(180deg); z-index: 1; }
    .stage.open .letter { transform: translateY(-110px); }
    .stage.reveal .envelope { animation: sinkAway .5s ease forwards; }
    @keyframes sinkAway { to { transform: translateY(40px) scale(.85); opacity: 0; } }

    .paper {
      position: absolute; top: 0; left: 0; right: 0; margin: auto; width: 100%;
      background: #fff; border-radius: 1.5rem; padding: 1.75rem 1.5rem 1.5rem; text-align: center;
      border: 2px solid var(--r200); box-shadow: 0 25px 50px -12px rgba(184,11,54,.35);
      opacity: 0; transform: scale(.6) translateY(80px); pointer-events: none;
      background-image: radial-gradient(var(--r100) 1px, transparent 1px); background-size: 16px 16px;
    }
    .stage.reveal .paper { animation: unfold .6s cubic-bezier(.175,.885,.32,1.275) .15s forwards; pointer-events: auto; }
    @keyframes unfold { to { opacity: 1; transform: none; } }
    .paper .badge { width: 60px; height: 60px; margin: -3.4rem auto .6rem; border-radius: 50%; background: var(--r500); color: #fff; display: grid; place-items: center; font-size: 1.6rem; box-shadow: 0 6px 14px rgba(239,46,95,.4); animation: wiggle 1.6s ease-in-out infinite; }
    @keyframes wiggle { 0%,100% { transform: rotate(-8deg) scale(1); } 50% { transform: rotate(8deg) scale(1.08); } }
    .paper h3 { margin: 0 0 .5rem; font-size: 1.15rem; color: #1f2937; }
    .paper .msg {
      font-family: 'Dancing Script', cursive; font-size: clamp(1.6rem, 6vw, 2rem); color: var(--r700); line-height: 1.35;
      background: rgba(255,245,247,.9); border: 1px solid var(--r100); border-radius: .9rem; padding: 1rem; margin: .75rem 0 1.1rem;
      min-height: 100px; display: grid; place-items: center; white-space: pre-wrap; word-break: break-word;
    }
    .paper .msg .msg-text { margin: 0; width: 100%; text-align: center; }
    .paper .msg span { opacity: 0; animation: letterIn .35s ease forwards; }
    @keyframes letterIn { from { opacity: 0; filter: blur(3px); } to { opacity: 1; filter: none; } }
    .paper button {
      width: 100%; padding: .85rem; border: 0; border-radius: .8rem; cursor: pointer; font: inherit; font-weight: 700; color: #fff;
      background: linear-gradient(90deg, var(--r500), var(--r600)); box-shadow: 0 4px 10px rgba(219,20,72,.3); transition: transform .15s, filter .2s;
    }
    .paper button:hover { filter: brightness(1.07); }
    .paper button:active { transform: scale(.98); }
    .paper .note { font-size: .72rem; color: #9ca3af; margin-top: .6rem; }

    .closing .paper { animation: poof .45s ease forwards !important; }
    @keyframes poof { to { opacity: 0; transform: scale(.4) rotate(6deg); filter: blur(4px); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    }
  </style>
</head>
<body>
  <div id="floaters"></div>

  <header>
    <h1>Mīlestības Ziņas</h1>
    <p class="sub">Katrs klikšķis slēpj īpašu un mīļu ziņu tieši tev ❤️</p>
  </header>

  <main>
    <div class="heart-wrap">
      <div class="heart-glow"></div>
      <button id="heart" aria-label="Atvērt ziņu">
        <svg viewBox="0 0 100 92" aria-hidden="true">
          <defs>
            <linearGradient id="hg" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" stop-color="#db1448"/><stop offset=".5" stop-color="#ef2e5f"/><stop offset="1" stop-color="#f76186"/>
            </linearGradient>
          </defs>
          <path d="M50 88 C20 66 2 50 2 28 C2 13 14 2 28 2 C38 2 45 7 50 15 C55 7 62 2 72 2 C86 2 98 13 98 28 C98 50 80 66 50 88 Z"
                fill="url(#hg)" stroke="rgba(255,255,255,.6)" stroke-width="2.5"/>
          <ellipse cx="27" cy="22" rx="10" ry="6" fill="rgba(255,255,255,.35)" transform="rotate(-30 27 22)"/>
        </svg>
        <span class="label">Spied šeit!</span>
      </button>
    </div>

    <div class="card">
      <p id="hint">Uzspied uz sirsniņas, lai atklātu jaunu ziņu!</p>
    </div>
  </main>

  <footer>Radīts ar mīlestību tieši Tev ❤️ <a href="/admin" class="edit-link" title="Pievienot jaunas ziņas" aria-label="Pievienot jaunas ziņas">✏️</a></footer>

  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="paper-title">
    <div class="stage" id="stage">
      <div class="envelope">
        <div class="env-back"></div>
        <div class="letter">tev ♡</div>
        <div class="env-front"></div>
        <div class="env-flap"></div>
      </div>
      <div class="paper">
        <div class="badge" id="badge">💌</div>
        <h3 id="paper-title">Īpaša ziņa tev! ❤️</h3>
        <div class="msg" id="msg"></div>
        <button id="close-btn">Paldies, mīļais! 🥰</button>
        <div class="note" id="note">Šī ziņa pazudīs, kad aizvērsi — bet mīlestība paliek 💕</div>
      </div>
    </div>
  </div>

  <script>
    const heart = document.getElementById('heart');
    const hint = document.getElementById('hint');
    const modal = document.getElementById('modal');
    const stage = document.getElementById('stage');
    let hasMessages = true;
    let busy = false;

    function render() {
      heart.classList.toggle('empty', !hasMessages);
      hint.textContent = !hasMessages
        ? 'Pagaidām visas ziņas izlasītas! Drīz būs jaunas — es tevi mīlu 🥰'
        : 'Uzspied uz sirsniņas, lai atklātu jaunu ziņu!';
    }

    async function loadStatus() {
      try {
        const res = await fetch('/api/love', { cache: 'no-store' });
        const data = await res.json();
        hasMessages = !!data.hasMessages;
      } catch { hint.textContent = 'Hmm, neizdevās ielādēt. Pamēģini vēlreiz 💗'; return; }
      render();
    }

    function heartBurst() {
      if (typeof confetti !== 'function') return;
      const r = heart.getBoundingClientRect();
      const origin = { x: (r.left + r.width / 2) / innerWidth, y: (r.top + r.height / 2) / innerHeight };
      const shapes = confetti.shapeFromText ? [confetti.shapeFromText({ text: '❤️', scalar: 2 }), confetti.shapeFromText({ text: '💕', scalar: 2 })] : undefined;
      confetti({ particleCount: 30, spread: 100, startVelocity: 35, origin, scalar: 2, shapes, ticks: 120 });
      confetti({ particleCount: 50, spread: 70, origin, colors: ['#ef2e5f', '#fa9bb2', '#ffe6ec', '#ffffff'] });
    }

    function typeOut(el, text) {
      // Words fade in one by one inside a normal paragraph, then it becomes plain text.
      const p = document.createElement('p');
      p.className = 'msg-text';
      el.innerHTML = '';
      el.appendChild(p);
      const parts = text.split(/(\s+)/);
      const words = parts.filter(w => w.trim()).length || 1;
      const step = Math.min(140, 1600 / words);
      let i = 0;
      for (const part of parts) {
        if (!part) continue;
        if (!part.trim()) { p.appendChild(document.createTextNode(part)); continue; }
        const s = document.createElement('span');
        s.textContent = part;
        s.style.animationDelay = (i++ * step) + 'ms';
        p.appendChild(s);
      }
      setTimeout(() => { p.textContent = text; }, i * step + 400);
    }

    function showPaper({ title, badge, text, note }) {
      document.getElementById('paper-title').textContent = title;
      document.getElementById('badge').textContent = badge;
      document.getElementById('note').textContent = note;
      const msg = document.getElementById('msg');
      msg.innerHTML = '';
      stage.className = 'stage';
      modal.classList.remove('closing');
      modal.classList.add('show');
      requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.add('open')));
      setTimeout(() => {
        stage.classList.add('reveal');
        setTimeout(() => typeOut(msg, text), 450);
        document.getElementById('close-btn').focus({ preventScroll: true });
      }, 2000);
    }

    heart.addEventListener('click', async () => {
      if (busy) return;
      busy = true;
      heart.classList.remove('squish'); void heart.offsetWidth; heart.classList.add('squish');
      heartBurst();
      try {
        const res = await fetch('/api/love/open', { method: 'POST' });
        if (!res.ok) throw new Error();
        const { message } = await res.json();
        if (message) {
          showPaper({ title: 'Īpaša ziņa tev! ❤️', badge: '💌', text: message.body, note: 'Šī ziņa pazudīs, kad aizvērsi — bet mīlestība paliek 💕' });
        } else {
          hasMessages = false;
          showPaper({ title: 'Tu esi izlasījusi visas ziņas! 💕', badge: '👑', text: 'Pagaidām tas ir viss — bet mana mīlestība pret tevi nekad nebeigsies. Drīz būs jaunas ziņas! ❤️', note: 'Ienāc vēlāk, varbūt tevi gaida kas jauns ✨' });
        }
      } catch {
        busy = false;
        hint.textContent = 'Ups, neizdevās atvērt ziņu. Pamēģini vēlreiz 💗';
      }
    });

    document.getElementById('close-btn').addEventListener('click', () => {
      modal.classList.add('closing');
      setTimeout(() => { modal.classList.remove('show', 'closing'); stage.className = 'stage'; busy = false; loadStatus(); }, 450);
    });

    (function floaters() {
      const box = document.getElementById('floaters');
      const colors = ['#fa9bb2', '#f76186', '#ef2e5f'];
      for (let i = 0; i < 16; i++) {
        const h = document.createElement('span');
        h.className = 'floater';
        h.textContent = '❤';
        h.style.left = Math.random() * 100 + 'vw';
        h.style.color = colors[i % colors.length];
        h.style.fontSize = (Math.random() * 20 + 12) + 'px';
        h.style.animationDuration = (Math.random() * 8 + 7) + 's';
        h.style.animationDelay = (Math.random() * 8) + 's';
        box.appendChild(h);
      }
    })();

    loadStatus();
  </script>
</body>
</html>
